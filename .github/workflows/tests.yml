name: Tests

on:
  workflow_dispatch:
  # Uncomment the schedule below to run tests daily
  # schedule:
  #   - cron: '0 0 * * *'  # Runs daily at midnight UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests.Utils
            project: tests/Tests.Utils/Tests.Utils.csproj
            extra-args: ''
          - name: Tests.Demo
            project: tests/Tests.Demo/Tests.Demo.csproj
            extra-args: '-p:OS=Linux'
          - name: Tests.ScreenShots
            project: tests/Tests.ScreenShots/Tests.ScreenShots.csproj
            extra-args: ''
          - name: Tests.Demo.ScreenShots
            project: tests/Tests.Demo.ScreenShots/Tests.Demo.ScreenShots.csproj
            extra-args: ''

    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore cross-sharp.sln

      - name: Run tests
        run: dotnet test ${{ matrix.project }} --configuration Release --logger "trx;LogFileName=${{ matrix.name }}.trx" ${{ matrix.extra-args }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: '**/TestResults/*.trx'
          retention-days: 7
