name: Tests

on:
  workflow_dispatch:
  # Uncomment the schedule below to run tests daily
  # schedule:
  #   - cron: '0 0 * * *'  # Runs daily at midnight UTC

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore cross-sharp.sln

      - name: Run Tests.Utils
        run: dotnet test tests/Tests.Utils/Tests.Utils.csproj --configuration Release --logger "trx;LogFileName=tests-utils.trx"

      - name: Run Tests.Demo
        run: dotnet test tests/Tests.Demo/Tests.Demo.csproj --configuration Release --logger "trx;LogFileName=tests-demo.trx" -p:OS=Linux

      - name: Run Tests.ScreenShots
        run: dotnet test tests/Tests.ScreenShots/Tests.ScreenShots.csproj --configuration Release --logger "trx;LogFileName=tests-screenshots.trx"

      - name: Run Tests.Demo.ScreenShots
        run: dotnet test tests/Tests.Demo.ScreenShots/Tests.Demo.ScreenShots.csproj --configuration Release --logger "trx;LogFileName=tests-demo-screenshots.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7
