name: Tests

on:
  workflow_dispatch:
  # Uncomment the schedule below to run tests daily
  # schedule:
  #   - cron: '0 0 * * *'  # Runs daily at midnight UTC

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Restore dependencies
        run: dotnet restore cross-sharp.sln

  test:
    needs: restore
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests.Utils
            project: tests/Tests.Utils/Tests.Utils.csproj
            extra-args: ''
          # Tests below require display/SDL3 - disabled for CI
          # - name: Tests.Demo
          #   project: tests/Tests.Demo/Tests.Demo.csproj
          #   extra-args: '-p:OS=Linux'
          # - name: Tests.ScreenShots
          #   project: tests/Tests.ScreenShots/Tests.ScreenShots.csproj
          #   extra-args: ''
          # - name: Tests.Demo.ScreenShots
          #   project: tests/Tests.Demo.ScreenShots/Tests.Demo.ScreenShots.csproj
          #   extra-args: ''

    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}

      - name: Run tests
        id: test
        run: |
          output=$(dotnet test ${{ matrix.project }} --configuration Release --no-restore --logger "trx;LogFileName=${{ matrix.name }}.trx" ${{ matrix.extra-args }} 2>&1)
          echo "$output"
          passed=$(echo "$output" | grep -oP 'Passed:\s*\K\d+' | tail -1)
          echo "passed=$passed" >> $GITHUB_OUTPUT

      - name: Write job summary
        if: success()
        run: |
          echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ All ${{ steps.test.outputs.passed }} tests passed successfully" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: '**/TestResults/*.trx'
          retention-days: 7
